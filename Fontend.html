<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <meta name="description" content="Practice job interviews, save your sessions, and get clear, rubric-based feedback.">
  <title>Interview Coach — Practice with purpose</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--navy:#101b35;--blue:#475be8;--muted:#68748a;--line:#e6eaf1;--card:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}
    .shell{min-height:100vh}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1160px)/2));position:sticky;top:0;z-index:3}
    .brand{display:flex;gap:11px;align-items:center;color:var(--navy);font-weight:750;font-size:17px;text-decoration:none}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--navy);color:#fff}
    .nav{display:flex;align-items:center;gap:22px}.nav button,.link-button{border:0;background:none;color:var(--muted);font-weight:600;padding:9px 4px}.nav button:hover,.link-button:hover{color:var(--blue)}.nav .user-name{font-size:14px;color:var(--muted)}
    main{max-width:1160px;padding:38px 24px 64px;margin:0 auto}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:750}.hero{background:linear-gradient(125deg,#111c38,#263a74 65%,#5266d9);color:white;border-radius:23px;padding:46px;display:grid;grid-template-columns:1.35fr .65fr;align-items:center;gap:30px;overflow:hidden}
    h1{font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-.045em;margin:14px 0}.hero p{max-width:570px;color:#e0e7ff;line-height:1.7;margin:14px 0 25px}.hero .eyebrow{color:#c3ceff}.hero-art{min-height:195px;display:grid;place-items:center}.orbit{width:188px;height:188px;border-radius:50%;border:1px solid #8796ef;display:grid;place-items:center;box-shadow:0 0 0 25px #ffffff0b,0 0 0 50px #ffffff08}.orbit span{font-size:62px}
    .button{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700;padding:12px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}.button:hover{background:#3549d5;transform:translateY(-1px)}.button:disabled{opacity:.5;cursor:not-allowed;transform:none}.button.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.button.ghost{background:#eef0ff;color:#384ccf}.button.danger{background:#fff0f0;color:#b42318}.button.small{padding:8px 11px;font-size:13px}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:36px 0 16px}.section-title h2{font-size:21px;letter-spacing:-.025em;margin:0}.section-title p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}.stat{display:flex;justify-content:space-between;align-items:center}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:25px;font-weight:750;margin-top:8px}.stat-icon{width:42px;height:42px;border-radius:12px;background:#eff1ff;display:grid;place-items:center;font-size:19px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{min-height:165px}.feature-icon{font-size:22px}.feature h3{font-size:16px;margin:13px 0 6px}.feature p,.muted{font-size:14px;line-height:1.6;color:var(--muted);margin:0}.activity{display:flex;flex-direction:column;gap:10px}    .session-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 17px;background:white;border:1px solid var(--line);border-radius:13px}.session-row strong{font-size:14px}.session-row small{display:block;color:var(--muted);margin-top:5px}.session-actions{display:flex;align-items:center;gap:8px}.pill{font-size:12px;font-weight:700;background:#eef0ff;color:#394ecb;padding:6px 9px;border-radius:99px;white-space:nowrap}
    .notice{border:1px solid #f0dfb5;background:#fffaf0;color:#70510c;padding:13px 15px;border-radius:11px;font-size:13px;line-height:1.55;margin:18px 0}.notice.blue{background:#f1f4ff;border-color:#dce2ff;color:#34448f}.empty{padding:26px;text-align:center;color:var(--muted);background:white;border:1px dashed #cdd4e1;border-radius:14px}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.page-head h1{font-size:32px;margin:7px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dce1eb;border-radius:9px;background:#fff;color:#172033;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6677ef;box-shadow:0 0 0 3px #6677ef22}.field textarea{min-height:160px;resize:vertical;line-height:1.6}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.counter{text-align:right;font-size:12px;color:var(--muted)}
    .interview-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.question-number{font-size:13px;color:var(--muted);font-weight:650}.question-text{font-size:24px;line-height:1.45;letter-spacing:-.025em;margin:18px 0 23px}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress span{height:100%;display:block;background:var(--blue);border-radius:99px;transition:width .2s}.rubric-list{padding-left:19px;color:var(--muted);font-size:13px;line-height:1.9}.score{font-size:48px;font-weight:800;letter-spacing:-.06em;color:var(--blue)}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.result-grid h3{margin:0 0 10px;font-size:15px}.result-grid ul{padding-left:18px;color:var(--muted);font-size:14px;line-height:1.8}.question-item{padding:15px 0;border-bottom:1px solid var(--line)}.question-item:last-child{border:0}.question-item p{margin:7px 0 0;font-size:14px;line-height:1.6}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid #dce1eb;background:#fff;border-radius:9px;padding:10px 12px}
    .auth-wrap{max-width:440px;margin:30px auto}.auth-wrap h1{font-size:32px}.auth-wrap .card{padding:26px}.auth-form{display:grid;gap:15px}.error{color:#b42318;font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 17px;background:#172033;color:white;border-radius:10px;box-shadow:0 8px 25px #10204433;z-index:8}.hidden{display:none!important}footer{border-top:1px solid var(--line);background:white;padding:24px;text-align:center;color:var(--muted);font-size:12px}
    :focus-visible{outline:3px solid #7182ff;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){.topbar{height:64px;padding:0 16px}.nav{gap:8px}.nav button{font-size:13px}.nav .user-name{display:none}main{padding:24px 16px 42px}.hero{grid-template-columns:1fr;padding:30px 24px}.hero-art{display:none}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.interview-layout{grid-template-columns:1fr}.form-grid,.result-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:flex-start}.session-row{align-items:flex-start}.toolbar{flex-wrap:wrap}.toolbar input{flex:1;min-width:170px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" data-view="home" aria-label="Interview Coach home"><span class="brand-mark" aria-hidden="true">IC</span><span>Interview Coach</span></a>
      <nav class="nav" aria-label="Main navigation">
        <button type="button" data-view="home">Dashboard</button>
        <button type="button" data-view="bank">Question bank</button>
        <span id="account-nav"></span>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer>Practice and learning only. Feedback may be AI-generated or rule-based; it is not a hiring decision.</footer>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    const API = "/api/v1";
    const app = document.querySelector("#app");
    const accountNav = document.querySelector("#account-nav");
    const state = { user: null, view: "home", interview: null, questionIndex: 0, questions: [], answers: {}, result: null, query: "", category: "all" };
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char]);
    const api = async (path, options = {}) => {
      const token = localStorage.getItem("interviewCoachToken");
      const response = await fetch(`${API}${path}`, { ...options, headers: { "Content-Type":"application/json", ...(token ? { Authorization:`Bearer ${token}` } : {}), ...options.headers } });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "The request could not be completed.");
      return body;
    };
    function notify(message) { const toast=document.querySelector("#toast"); toast.textContent=message; toast.classList.remove("hidden"); setTimeout(()=>toast.classList.add("hidden"),3200); }
    function renderNav() {
      accountNav.innerHTML = state.user
        ? `<button type="button" data-view="profile">Profile</button><span class="user-name">${escapeHtml(state.user.display_name)}</span><button type="button" id="logout-button">Sign out</button>`
        : `<button type="button" data-view="auth">Sign in</button>`;
      document.querySelector("#logout-button")?.addEventListener("click", logout);
    }
    async function loadUser() {
      const token=localStorage.getItem("interviewCoachToken");
      if (!token) { state.user=null; renderNav(); return; }
      try { const data=await api("/profile"); state.user=data; }
      catch { localStorage.removeItem("interviewCoachToken"); state.user=null; }
      renderNav();
    }
    function shellTitle(eyebrow,title,copy="") { return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${copy?`<p class="muted">${copy}</p>`:""}</div></div>`; }
    async function go(view) {
      state.view=view;
      if (view==="home") await renderHome();
      else if (view==="auth") renderAuth();
      else if (view==="setup") renderSetup();
      else if (view==="interview") renderInterview();
      else if (view==="result") renderResult();
      else if (view==="history") await renderHistory();
      else if (view==="bank") await renderBank();
      else if (view==="profile") await renderProfile();
      app.focus({preventScroll:true});
      window.scrollTo(0,0);
    }
    async function renderHome() {
      if (!state.user) {
        app.innerHTML=`<section class="hero"><div><div class="eyebrow">A better way to get interview-ready</div><h1>Practice with purpose.<br>Show up with confidence.</h1><p>Work through original behavioral and technical interview questions, reflect on your answers, and build a practice habit that fits your goals.</p><button class="button" id="hero-start">Start practising <span aria-hidden="true">→</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"><span>✦</span></div></div></section>
        <div class="section-title"><div><h2>Everything you need to practise</h2><p>A clear, focused place to prepare for your next conversation.</p></div></div>
        <section class="grid"><article class="card feature"><span class="feature-icon">◉</span><h3>Realistic practice</h3><p>Take a guided interview with questions selected for your chosen category and difficulty.</p></article><article class="card feature"><span class="feature-icon">◎</span><h3>Useful reflection</h3><p>See a transparent, simple rubric to help you identify answer strengths and areas to improve.</p></article><article class="card feature"><span class="feature-icon">↗</span><h3>Progress you can revisit</h3><p>Your signed-in practice sessions and results are saved so you can pick up where you left off.</p></article></section>
        <div class="section-title"><div><h2>How it works</h2><p>Three steps, no pressure.</p></div></div><section class="grid"><article class="card"><span class="pill">01 · Choose</span><h3>Pick your interview</h3><p class="muted">Select behavioral or technical questions and a comfortable difficulty.</p></article><article class="card"><span class="pill">02 · Answer</span><h3>Think it through</h3><p class="muted">Respond in your own words, one question at a time.</p></article><article class="card"><span class="pill">03 · Reflect</span><h3>Review your feedback</h3><p class="muted">Review practice feedback tied to your submitted answer, then practise again.</p></article></section>
        <div class="notice"><strong>Honest about the limits:</strong> AI mode is optional and server-configured. Without it, this starter app uses curated questions and a rule-based demo. AI output may be inaccurate; no feedback guarantees success or makes hiring decisions. Avoid entering sensitive personal information.</div>`;
        document.querySelector("#hero-start").addEventListener("click",()=>go(state.user?"setup":"auth"));
        return;
      }
      app.innerHTML=`<div class="eyebrow">Your practice space</div><h1 style="font-size:34px;margin:8px 0">Welcome back, ${escapeHtml(state.user.display_name)}.</h1><p class="muted">Small, focused practice adds up. Ready for another round?</p><div class="stats" id="stats"><article class="stat"><div><div class="stat-label">Completed sessions</div><div class="stat-value">—</div></div><span class="stat-icon">✓</span></article><article class="stat"><div><div class="stat-label">Questions answered</div><div class="stat-value">—</div></div><span class="stat-icon">✎</span></article><article class="stat"><div><div class="stat-label">Average rubric score</div><div class="stat-value">—</div></div><span class="stat-icon">↗</span></article></div><div class="section-title"><div><h2>Start a practice interview</h2><p>Choose a format and take it at your own pace.</p></div><button type="button" class="button" id="start-button">New interview</button></div><section class="grid"><article class="card feature"><span class="pill">Behavioral</span><h3>Tell your story clearly</h3><p>Practise teamwork, problem-solving, and learning from experience.</p><button class="link-button" data-quick="behavioral">Practise behavioral →</button></article><article class="card feature"><span class="pill">Technical</span><h3>Explain your thinking</h3><p>Work through foundational computer science and engineering concepts.</p><button class="link-button" data-quick="technical">Practise technical →</button></article><article class="card feature"><span class="pill">Curated questions</span><h3>Explore the question bank</h3><p>Browse original sample questions before starting an interview.</p><button class="link-button" data-view="bank">Browse questions →</button></article></section><div class="section-title"><div><h2>Recent sessions</h2><p>Your saved practice history.</p></div><button class="link-button" id="history-button">View history →</button></div><div id="recent" class="activity"><div class="empty">Loading your sessions…</div></div>`;
      document.querySelector("#start-button").addEventListener("click",()=>go("setup"));
      document.querySelectorAll("[data-quick]").forEach(button=>button.addEventListener("click",()=>go("setup").then(()=>{document.querySelector("#category").value=button.dataset.quick;})));
      document.querySelectorAll('[data-view="bank"]').forEach(button=>button.addEventListener("click",()=>go("bank")));
      document.querySelector("#history-button").addEventListener("click",()=>go("history"));
      try {
        const {sessions}=await api("/interviews");
        const done=sessions.filter(item=>item.status==="completed");
        const answers=done.reduce((sum,item)=>sum+(item.question_count||0),0);
        const average=done.length?Math.round(done.reduce((sum,item)=>sum+(item.overall_score||0),0)/done.length):null;
        document.querySelector("#stats").innerHTML=`<article class="stat"><div><div class="stat-label">Completed sessions</div><div class="stat-value">${done.length}</div></div><span class="stat-icon">✓</span></article><article class="stat"><div><div class="stat-label">Questions answered</div><div class="stat-value">${answers}</div></div><span class="stat-icon">✎</span></article><article class="stat"><div><div class="stat-label">Average rubric score</div><div class="stat-value">${average===null?"—":`${average}%`}</div></div><span class="stat-icon">↗</span></article>`;
        document.querySelector("#recent").innerHTML=sessions.length?sessions.slice(0,3).map(sessionRow).join(""):`<div class="empty">No interviews yet. Start your first practice session when you’re ready.</div>`;
      } catch(error) { document.querySelector("#recent").innerHTML=`<div class="empty">${escapeHtml(error.message)} <button class="link-button" id="retry-home">Retry</button></div>`;document.querySelector("#retry-home").addEventListener("click",renderHome); }
    }
    function sessionRow(item) { const date=new Date(item.created_at).toLocaleDateString();return `<div class="session-row"><div><strong>${escapeHtml(item.category)} · ${escapeHtml(item.difficulty)}</strong><small>${date} · ${item.question_count} questions</small></div><div class="session-actions"><span class="pill">${item.status==="completed"?`${item.overall_score}% score`:"In progress"}</span><button class="button ghost small" type="button" data-review="${escapeHtml(item.id)}">${item.status==="completed"?"Review":"Resume"}</button><button class="button danger small" type="button" data-delete="${escapeHtml(item.id)}" aria-label="Delete ${escapeHtml(item.category)} interview">Delete</button></div></div>`; }
    async function reviewSession(id) {
      try {
        const detail=await api(`/interviews/${id}`);
        state.interview={id:detail.id,category:detail.category,difficulty:detail.difficulty};
        state.questions=detail.questions;
        state.answers=Object.fromEntries(detail.answers.map(answer=>[answer.question_id,answer.answer_text]));
        if(detail.status==="completed"){state.result=await api(`/interviews/${id}/complete`,{method:"POST"});await go("result");return;}
        state.questionIndex=Math.max(0,state.questions.findIndex(question=>!state.answers[question.id]));
        await go("interview");
      } catch(error) { notify(error.message); }
    }
    async function deleteSession(id) {
      if(!confirm("Delete this interview and its saved answers? This cannot be undone."))return;
      try{await api(`/interviews/${id}`,{method:"DELETE"});notify("Interview deleted.");if(state.view==="history")await renderHistory();else await renderHome();}
      catch(error){notify(error.message);}
    }
    function renderAuth() {
      app.innerHTML=`<section class="auth-wrap"><div class="eyebrow">Your practice, saved</div><h1>Welcome to Interview Coach</h1><p class="muted" style="margin-bottom:18px">Create an account or sign in to keep your interview sessions together.</p><div class="card"><div class="toolbar"><button type="button" class="button small" id="login-tab">Sign in</button><button type="button" class="button secondary small" id="register-tab">Create account</button></div><form class="auth-form" id="auth-form"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required><small class="muted">At least 10 characters.</small></div><div id="name-field" class="field hidden"><label for="display-name">Name</label><input id="display-name" name="display_name" autocomplete="name" maxlength="80"></div><p id="auth-error" class="error" role="alert"></p><button class="button" type="submit" id="auth-submit">Sign in</button></form></div><div class="notice">Account data is stored by this local development server. Do not use a real password or sensitive interview content in this demo.</div></section>`;
      let mode="login"; const setMode=(next)=>{mode=next;document.querySelector("#auth-submit").textContent=next==="login"?"Sign in":"Create account";document.querySelector("#name-field").classList.toggle("hidden",next==="login");document.querySelector("#display-name").required=next==="register";document.querySelector("#password").autocomplete=next==="login"?"current-password":"new-password";document.querySelector("#login-tab").className=next==="login"?"button small":"button secondary small";document.querySelector("#register-tab").className=next==="register"?"button small":"button secondary small";document.querySelector("#auth-error").textContent="";};
      document.querySelector("#login-tab").addEventListener("click",()=>setMode("login"));document.querySelector("#register-tab").addEventListener("click",()=>setMode("register"));
      document.querySelector("#auth-form").addEventListener("submit",async event=>{event.preventDefault();const form=new FormData(event.currentTarget);const submit=document.querySelector("#auth-submit");submit.disabled=true;document.querySelector("#auth-error").textContent="";try{const data=await api(`/auth/${mode}`,{method:"POST",body:JSON.stringify({email:form.get("email"),password:form.get("password"),display_name:form.get("display_name")})});localStorage.setItem("interviewCoachToken",data.access_token);state.user=data.user;renderNav();await go("home");notify(mode==="register"?"Account created. Welcome!":"Signed in.");}catch(error){document.querySelector("#auth-error").textContent=error.message;}finally{submit.disabled=false;}});
    }
    async function logout(){try{await api("/auth/logout",{method:"POST"});localStorage.removeItem("interviewCoachToken");state.user=null;renderNav();await go("home");notify("You have signed out.");}catch(error){notify(`Could not sign out: ${error.message}`);}}
    async function renderProfile(){
      if(!state.user){await go("auth");return;}
      try{
        const profile=await api("/profile");
        const categories=profile.preferred_categories||[];
        app.innerHTML=`${shellTitle("Your account","Profile & preferences","Choose only the details that help personalize your practice.")}<section class="card"><form id="profile-form"><div class="form-grid"><div class="field"><label for="profile-name">Display name</label><input id="profile-name" maxlength="80" required value="${escapeHtml(profile.display_name)}"></div><div class="field"><label for="profile-education">Education level</label><input id="profile-education" maxlength="80" value="${escapeHtml(profile.education_level||"")}" placeholder="Optional"></div><div class="field"><label for="profile-field">Field of study</label><input id="profile-field" maxlength="100" value="${escapeHtml(profile.field_of_study||"")}" placeholder="Optional"></div><div class="field"><label for="profile-experience">Experience level</label><select id="profile-experience"><option value="">Choose if useful</option><option value="student">Student</option><option value="entry_level">Entry level</option><option value="early_career">Early career</option></select></div><div class="field full"><label for="profile-role">Target role</label><input id="profile-role" maxlength="100" value="${escapeHtml(profile.target_role||"")}" placeholder="Optional"></div><fieldset class="field full"><legend class="muted">Preferred categories</legend><label><input type="checkbox" name="preferred-category" value="behavioral" ${categories.includes("behavioral")?"checked":""}> Behavioral / HR</label><label><input type="checkbox" name="preferred-category" value="technical" ${categories.includes("technical")?"checked":""}> Technical</label><label><input type="checkbox" name="preferred-category" value="mixed" ${categories.includes("mixed")?"checked":""}> Mixed</label></fieldset></div><p id="profile-error" class="error" role="alert"></p><div class="form-actions"><button class="button" id="save-profile" type="submit">Save profile</button></div></form></section><section class="card" style="margin-top:16px"><h2 style="font-size:18px;margin:0 0 8px">Delete account and data</h2><p class="muted">This permanently deletes your account, interview sessions, answers, and active sign-in sessions from this local database.</p><div class="form-actions"><button class="button danger" type="button" id="delete-account">Delete my account</button></div></section>`;
        document.querySelector("#profile-experience").value=profile.experience_level||"";
        document.querySelector("#profile-form").addEventListener("submit",async event=>{event.preventDefault();const button=document.querySelector("#save-profile");button.disabled=true;document.querySelector("#profile-error").textContent="";try{const updated=await api("/profile",{method:"PATCH",body:JSON.stringify({display_name:document.querySelector("#profile-name").value.trim(),education_level:document.querySelector("#profile-education").value.trim()||null,field_of_study:document.querySelector("#profile-field").value.trim()||null,experience_level:document.querySelector("#profile-experience").value||null,target_role:document.querySelector("#profile-role").value.trim()||null,preferred_categories:[...document.querySelectorAll('[name="preferred-category"]:checked')].map(input=>input.value)})});state.user=updated;renderNav();notify("Profile saved.");}catch(error){document.querySelector("#profile-error").textContent=error.message;}finally{button.disabled=false;}});
        document.querySelector("#delete-account").addEventListener("click",async()=>{if(!confirm("Permanently delete your account, saved interviews, and answers? This cannot be undone."))return;try{await api("/profile",{method:"DELETE"});localStorage.removeItem("interviewCoachToken");state.user=null;renderNav();await go("home");notify("Your account and saved interview data were deleted.");}catch(error){notify(`Could not delete account: ${error.message}`);}});
      }catch(error){app.innerHTML=`<div class="empty">${escapeHtml(error.message)} <button class="link-button" id="retry-profile">Retry</button></div>`;document.querySelector("#retry-profile").addEventListener("click",renderProfile);}
    }
    function renderSetup() {
      if(!state.user){go("auth");return;}
      app.innerHTML=`${shellTitle("New practice","Set up your interview","Choose a focused session. You can take your time on every answer.")}<div class="card"><form id="setup-form"><div class="form-grid"><div class="field"><label for="category">Interview category</label><select id="category"><option value="behavioral">Behavioral / HR</option><option value="technical">Technical</option><option value="mixed">Mixed</option></select></div><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div><div class="field"><label for="count">Number of questions</label><select id="count"><option value="5">5 questions</option><option value="10">10 questions</option></select></div><div class="field"><label for="target-role">Target role <span class="muted">(optional)</span></label><input id="target-role" maxlength="100" placeholder="e.g. Frontend developer"></div></div><div class="notice blue">Anthropic mode, when enabled by the server, can generate questions for the selected category and difficulty and provide structured practice feedback. If generation is unavailable, curated questions are used. Default demo mode uses curated examples and simple rule-based feedback; curated question labels do not adapt to the selected difficulty.</div><div class="form-actions"><button class="button secondary" type="button" id="setup-cancel">Cancel</button><button class="button" type="submit" id="create-interview">Start interview</button></div></form></div>`;
      document.querySelector("#setup-cancel").addEventListener("click",()=>go("home"));
      document.querySelector("#setup-form").addEventListener("submit",async event=>{event.preventDefault();const button=document.querySelector("#create-interview");button.disabled=true;try{const data=await api("/interviews",{method:"POST",body:JSON.stringify({category:document.querySelector("#category").value,difficulty:document.querySelector("#difficulty").value.toLowerCase(),question_count:Number(document.querySelector("#count").value),target_role:document.querySelector("#target-role").value.trim()||null})});state.interview=data;state.questions=data.questions;state.answers={};state.questionIndex=0;await go("interview");}catch(error){notify(error.message);}finally{button.disabled=false;}});
    }
    function renderInterview() {
      if(!state.interview){go("setup");return;}
      const index=state.questionIndex,question=state.questions[index];
      const questionNotice=state.interview.question_source==="curated_fallback"
        ?`<div class="notice">AI question generation was unavailable. These are curated fallback questions, not AI-generated questions. ${escapeHtml(state.interview.generation_notice||"")}</div>`
        :state.interview.question_source==="anthropic_generated"
          ?`<div class="notice">These questions were generated by Anthropic for practice. Review them critically; generated content may be inaccurate.</div>`
          :"";
      app.innerHTML=`${shellTitle("Practice in progress",`Question ${index+1} of ${state.questions.length}`,"Take a moment to think. Your answer is saved when you continue.")}<div class="progress" aria-label="Interview progress"><span style="width:${Math.round((index+1)/state.questions.length*100)}%"></span></div><div class="interview-layout"><section class="card">${questionNotice}<div class="question-number">${escapeHtml(question.category)} · ${escapeHtml(question.difficulty)}</div><h2 class="question-text">${escapeHtml(question.question_text)}</h2><form id="answer-form"><div class="field"><label for="answer">Your answer</label><textarea id="answer" maxlength="5000" placeholder="Write your answer here. For behavioral questions, you can use Situation, Task, Action, Result as a guide." required>${escapeHtml(state.answers[question.id]||"")}</textarea><span class="counter" id="answer-count">0 / 5,000</span></div><div class="form-actions" style="justify-content:space-between"><button type="button" class="button secondary" id="leave-interview">Save and exit</button><button type="submit" class="button" id="next-answer">${index===state.questions.length-1?"Finish interview":"Save & continue"}</button></div><p id="interview-error" class="error" role="alert"></p></form></section><aside class="card"><h3 style="margin-top:0">What makes a strong answer?</h3><p class="muted">Use these prompts to reflect; this rubric is guidance, not a hiring score.</p><ul class="rubric-list"><li>Answer the question directly</li><li>Explain your reasoning clearly</li><li>Include a specific example</li><li>Describe the outcome or what you learned</li></ul><div class="notice">Your text is sent to this app’s API and saved to its local database so your session can be reviewed later.</div></aside></div>`;
      const textarea=document.querySelector("#answer"),counter=document.querySelector("#answer-count");counter.textContent=`${textarea.value.length} / 5,000`;textarea.addEventListener("input",()=>counter.textContent=`${textarea.value.length} / 5,000`);
      document.querySelector("#leave-interview").addEventListener("click",async()=>{if(confirm("Save your progress and return to your dashboard?")){await api(`/interviews/${state.interview.id}/answers/${question.id}`,{method:"PUT",body:JSON.stringify({answer_text:textarea.value})}).catch(error=>notify(error.message));await go("home");}});
      document.querySelector("#answer-form").addEventListener("submit",async event=>{event.preventDefault();const answer=textarea.value.trim();if(!answer){document.querySelector("#interview-error").textContent="Write an answer before continuing.";return;}const button=document.querySelector("#next-answer");button.disabled=true;document.querySelector("#interview-error").textContent="";try{await api(`/interviews/${state.interview.id}/answers/${question.id}`,{method:"PUT",body:JSON.stringify({answer_text:answer})});state.answers[question.id]=answer;if(index<state.questions.length-1){state.questionIndex++;renderInterview();}else{state.result=await api(`/interviews/${state.interview.id}/complete`,{method:"POST"});await go("result");}}catch(error){document.querySelector("#interview-error").textContent=error.message;button.disabled=false;}});
    }
    function renderResult() {
      if(!state.result){go("home");return;}const result=state.result;
      const aiFeedback=result.feedback_type==="anthropic";
      const scoringMethod=aiFeedback?"Anthropic feedback uses five equally weighted practice dimensions.":"The rule-based demo uses a simple writing heuristic, not the five-dimension AI rubric.";
      app.innerHTML=`${shellTitle("Session complete","A moment to reflect","A rubric-based snapshot of this practice session.")}<div class="card" style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><div class="score">${result.overall_score}<span style="font-size:20px">%</span></div><div><h2 style="margin:0 0 7px">Your practice score</h2><p class="muted">${escapeHtml(result.category)} · ${escapeHtml(result.difficulty)} · ${result.question_count} questions</p><p class="muted">${scoringMethod} This is practice feedback, not a measure of ability or hiring readiness.</p></div></div><div class="result-grid"><article class="card"><h3>What went well</h3><ul>${result.strengths.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul></article><article class="card"><h3>Try next time</h3><ul>${result.improvements.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul></article></div>${result.suggested_practice?.length?`<section class="card"><h3>Suggested practice</h3><ul>${result.suggested_practice.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul></section>`:""}<div class="section-title"><div><h2>Question-by-question review</h2><p>Your answers and feedback, saved in this session.</p></div></div><section class="card">${result.questions.map((item,index)=>`<article class="question-item"><span class="pill">Question ${index+1} · ${item.score}%</span><p><strong>${escapeHtml(item.question_text)}</strong></p><p>${escapeHtml(item.feedback)}</p>${item.dimensions?.length?`<ul class="rubric-list">${item.dimensions.map(dimension=>`<li><strong>${escapeHtml(dimension.name)} · ${dimension.score}%:</strong> ${escapeHtml(dimension.explanation)}</li>`).join("")}</ul>`:""}</article>`).join("")}</section><div class="notice">${aiFeedback?"AI-generated practice feedback may be inaccurate and should be checked, especially for technical facts. It is not an employment decision.":"This is a local rule-based demo, not AI output. It checks simple answer signals such as length, examples, and outcomes; it cannot verify factual correctness."} ${result.limitations?.map(escapeHtml).join(" ")||""}</div><div class="form-actions"><button class="button secondary" id="result-history">View history</button><button class="button" id="again">Practise again</button></div>`;
      document.querySelector("#result-history").addEventListener("click",()=>go("history"));document.querySelector("#again").addEventListener("click",()=>go("setup"));
    }
    async function renderHistory() {
      if(!state.user){go("auth");return;}app.innerHTML=`${shellTitle("Your activity","Interview history","Review the practice sessions saved to your account.")}<div class="toolbar"><select id="history-category" aria-label="Filter history by category"><option value="all">All categories</option><option value="behavioral">Behavioral</option><option value="technical">Technical</option><option value="mixed">Mixed</option></select><select id="history-status" aria-label="Filter history by status"><option value="all">All statuses</option><option value="completed">Completed</option><option value="in_progress">In progress</option></select><select id="history-sort" aria-label="Sort history"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="history-list" class="activity"><div class="empty">Loading your sessions…</div></div>`;
      try{const {sessions}=await api("/interviews?limit=100");const draw=()=>{const category=document.querySelector("#history-category").value,status=document.querySelector("#history-status").value,order=document.querySelector("#history-sort").value;const visible=sessions.filter(item=>(category==="all"||item.category===category)&&(status==="all"||item.status===status));if(order==="oldest")visible.reverse();document.querySelector("#history-list").innerHTML=visible.length?visible.map(sessionRow).join(""):`<div class="empty">No sessions match these filters.</div>`;};["history-category","history-status","history-sort"].forEach(id=>document.querySelector(`#${id}`).addEventListener("change",draw));draw();}catch(error){document.querySelector("#history-list").innerHTML=`<div class="empty">${escapeHtml(error.message)} <button class="link-button" id="history-retry">Retry</button></div>`;document.querySelector("#history-retry").addEventListener("click",renderHistory);}
    }
    async function renderBank() {
      app.innerHTML=`${shellTitle("Practice library","Question bank","Explore original sample questions. Search by topic or choose a category.")}<div class="toolbar"><input id="bank-search" type="search" placeholder="Search questions" aria-label="Search questions"><select id="bank-category" aria-label="Filter by category"><option value="all">All categories</option><option value="behavioral">Behavioral</option><option value="technical">Technical</option></select><select id="bank-difficulty" aria-label="Filter by difficulty"><option value="all">All difficulties</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select><select id="bank-skill" aria-label="Filter by skill"><option value="all">All skills</option></select></div><div id="bank-list" class="card"><p class="muted">Loading curated questions…</p></div>`;
      try{const {questions}=await api("/questions");const skillOptions=[...new Set(questions.flatMap(item=>item.skills))].sort();document.querySelector("#bank-skill").innerHTML='<option value="all">All skills</option>'+skillOptions.map(skill=>`<option value="${escapeHtml(skill)}">${escapeHtml(skill)}</option>`).join("");const draw=()=>{const query=document.querySelector("#bank-search").value.toLowerCase(),category=document.querySelector("#bank-category").value,difficulty=document.querySelector("#bank-difficulty").value,skill=document.querySelector("#bank-skill").value;const filtered=questions.filter(item=>(category==="all"||item.category===category)&&(difficulty==="all"||item.difficulty===difficulty)&&(skill==="all"||item.skills.includes(skill))&&`${item.question_text} ${item.category} ${item.skills.join(" ")}`.toLowerCase().includes(query));document.querySelector("#bank-list").innerHTML=filtered.length?filtered.map(item=>`<article class="question-item"><span class="pill">${escapeHtml(item.category)} · ${escapeHtml(item.difficulty)}</span><p>${escapeHtml(item.question_text)}</p><small class="muted">Skills: ${item.skills.map(escapeHtml).join(", ")}</small></article>`).join(""):`<div class="empty">No questions match those filters.</div>`;};["bank-search","bank-category","bank-difficulty","bank-skill"].forEach(id=>document.querySelector(`#${id}`).addEventListener(id==="bank-search"?"input":"change",draw));draw();}catch(error){document.querySelector("#bank-list").innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`;}
    }
    document.addEventListener("click",event=>{const review=event.target.closest("[data-review]");if(review){reviewSession(review.dataset.review);return;}const remove=event.target.closest("[data-delete]");if(remove){deleteSession(remove.dataset.delete);return;}const button=event.target.closest("[data-view]");if(button)go(button.dataset.view);});
    async function start(){await loadUser();await go("home");}
    start().catch(error=>{app.innerHTML=`<div class="empty">Could not start the app: ${escapeHtml(error.message)}<br><br>Run the server using the instructions in README.md.</div>`;});
  </script>
</body>
</html>
