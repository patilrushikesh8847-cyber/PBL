<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Interview Coach — Practice with purpose</title>
  <style>
    :root{--ink:#172033;--muted:#6f7890;--navy:#111827;--primary:#635bff;--primary-2:#8b5cf6;--cyan:#3dd9eb;--paper:#f5f7fb;--line:#e8eaf1;--white:#fff;--success:#18a66a;--danger:#d84a4a;--shadow:0 18px 50px rgba(29,38,76,.10);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
    .app-shell{min-height:100vh}.topbar{height:76px;background:rgba(255,255,255,.88);border-bottom:1px solid rgba(232,234,241,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:30}
    .brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:800;letter-spacing:-.02em}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 10px 24px rgba(99,91,255,.28)}.brand-mark svg{width:23px;height:23px}
    .nav{display:flex;align-items:center;gap:5px}.nav-button,.icon-button,.link-button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 12px;border-radius:10px;transition:.2s ease}.nav-button:hover,.nav-button.active{color:var(--primary);background:#f0efff}.nav-button.active{box-shadow:inset 0 -2px var(--primary)}.user-chip{display:flex;align-items:center;gap:9px;margin-left:8px;padding:5px 5px 5px 7px;border:1px solid var(--line);border-radius:999px;background:white}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dffaff,#e9e4ff);color:#5751c9;font-size:13px;font-weight:800}.user-chip .nav-button{padding:7px}.mobile-menu{display:none}
    main{max-width:1180px;margin:auto;padding:34px 22px 72px}.page{animation:pageIn .38s cubic-bezier(.2,.75,.25,1)}@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .button{border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7470ff);color:white;font-weight:800;padding:12px 17px;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 24px rgba(99,91,255,.18);transition:transform .18s,box-shadow .18s,filter .18s}.button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(99,91,255,.24);filter:saturate(1.08)}.button:active{transform:translateY(0)}.button.secondary{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.button.ghost{background:#f0efff;color:#5149c8;box-shadow:none}.button.danger{background:#fff0f0;color:#b62d2d;box-shadow:none}.button.small{padding:9px 12px;font-size:13px}.button svg,.icon-button svg,.link-button svg{width:17px;height:17px}
    .hero{position:relative;overflow:hidden;border-radius:26px;padding:56px;min-height:380px;background:linear-gradient(125deg,#151e38 0%,#252f6b 58%,#5a61d9 100%);color:white;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-100px;top:-190px;background:radial-gradient(circle,rgba(124,234,255,.30),transparent 62%)}.hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent 40%,black)}
    .hero-copy{position:relative;z-index:2;width:68%;animation:floatIn .6s .05s both}@keyframes floatIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:#9ba4ff}.hero h1{font-size:clamp(38px,5vw,58px);line-height:1.02;letter-spacing:-.055em;margin:14px 0 18px}.hero p{max-width:590px;line-height:1.75;color:#e4e7ff;margin:0 0 28px}.hero-actions{display:flex;gap:10px}.hero .button.primary-light{background:white;color:#292f65;box-shadow:0 15px 35px rgba(12,18,52,.22)}
    .orbit-wrap{position:absolute;right:50px;top:50%;transform:translateY(-50%);z-index:2;width:220px;height:220px}.orbit{position:absolute;inset:0;border:1px solid rgba(255,255,255,.22);border-radius:50%;animation:spin 18s linear infinite}.orbit.two{inset:38px;animation-direction:reverse;animation-duration:12s}.orbit:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#7ceafa;box-shadow:0 0 18px #7ceafa;top:14px;left:38px}.orbit.two:before{top:auto;bottom:8px;left:auto;right:38px;background:#ffc7ed;box-shadow:0 0 18px #ffc7ed}.center-orb{position:absolute;inset:67px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(185,205,255,.8));color:#414b9b;font-size:43px;box-shadow:0 20px 60px rgba(10,18,60,.28);animation:breath 3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breath{50%{transform:scale(1.06)}}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.stat,.card{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 7px 24px rgba(31,42,84,.04)}.stat{padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.stat-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#f1f0ff;color:var(--primary)}.stat-icon svg{width:22px;height:22px}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-value{font-size:27px;font-weight:850;margin-top:5px;letter-spacing:-.04em}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:32px 0 14px;gap:12px}.section-title h2{margin:0;font-size:21px;letter-spacing:-.03em}.section-title p{margin:6px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{padding:22px;min-height:190px;transition:.25s ease}.feature:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:#dcdffc}.feature-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#efefff,#e6faff);color:#5551ce}.feature-icon svg{width:21px;height:21px}.feature h3{font-size:16px;margin:16px 0 7px}.feature p,.muted{color:var(--muted);line-height:1.65;font-size:14px;margin:0}.feature .link-button{margin-top:12px;padding-left:0;color:var(--primary)}
    .activity{display:flex;flex-direction:column;gap:9px}.session-row{padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:white;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:.2s}.session-row:hover{border-color:#dcdffc;transform:translateX(4px)}.session-row strong{font-size:14px}.session-row small{display:block;color:var(--muted);margin-top:5px}.session-actions{display:flex;align-items:center;gap:8px}.pill{font-size:12px;font-weight:800;border-radius:99px;padding:7px 10px;background:#efefff;color:#5149c8}.pill.completed{background:#eaf8f1;color:#1b8052}.pill.progress{background:#fff5df;color:#96701c}
    .notice{border:1px solid #e9dbb2;background:#fffaf0;color:#745a1d;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.55;margin:18px 0}.notice.blue{border-color:#d9dfff;background:#f4f5ff;color:#44519a}.empty{padding:28px;text-align:center;border:1px dashed #cfd5e3;border-radius:14px;color:var(--muted);background:white}
    .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.page-head h1{font-size:34px;letter-spacing:-.04em;margin:7px 0}.back-button{display:inline-flex;align-items:center;gap:7px;border:0;background:white;border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:9px 12px;font-weight:700}.back-button svg{width:16px;height:16px}
    .card{padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #dde1eb;border-radius:11px;background:#fff;color:var(--ink);padding:12px 13px;outline:none;transition:.2s}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7770ee;box-shadow:0 0 0 4px rgba(99,91,255,.11)}.field textarea{min-height:170px;resize:vertical;line-height:1.65}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.counter{text-align:right;color:var(--muted);font-size:12px;margin-top:7px}
    .setup-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.setup-side{height:max-content;position:sticky;top:96px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{min-height:82px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:7px;cursor:pointer;transition:.2s}.choice input:checked+label{border-color:var(--primary);background:#f4f3ff;color:#4e48c2;box-shadow:0 7px 18px rgba(99,91,255,.08)}.choice label strong{font-size:13px}.choice label span{font-size:12px;color:var(--muted)}
    .interview-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.question-card{min-height:480px}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:11px 0 28px}.progress span{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .35s ease}.question-text{font-size:25px;line-height:1.45;letter-spacing:-.03em;margin:18px 0 24px}.answer-footer{display:flex;justify-content:space-between;align-items:center;gap:12px}.side-card{height:max-content;position:sticky;top:96px}.rubric-list{padding-left:18px;color:var(--muted);font-size:13px;line-height:2}.score-ring{width:120px;height:120px;border-radius:50%;margin:4px auto 20px;display:grid;place-items:center;background:conic-gradient(var(--primary) var(--score),#edf0f6 0);position:relative}.score-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:white}.score-ring span{position:relative;font-size:37px;font-weight:850;letter-spacing:-.06em;color:#5149c8}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.result-grid h3{font-size:15px;margin:0 0 10px}.result-grid ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.8}.question-item{padding:15px 0;border-bottom:1px solid var(--line)}.question-item:last-child{border:0}.question-item p{margin:7px 0 0;font-size:14px;line-height:1.6}
    .toolbar{display:flex;gap:9px;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;background:white;padding:11px 12px}.toolbar input{flex:1}.auth-wrap{max-width:430px;margin:20px auto}.auth-wrap .card{padding:28px}.auth-wrap h1{font-size:32px;margin:8px 0 20px}.auth-form{display:grid;gap:14px}.error{color:#b62d2d;font-size:13px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,25px);opacity:0;background:#172033;color:white;border-radius:12px;padding:12px 17px;box-shadow:0 12px 35px rgba(15,23,42,.25);z-index:50;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}footer{border-top:1px solid var(--line);background:white;color:var(--muted);text-align:center;padding:22px;font-size:12px}:focus-visible{outline:3px solid rgba(99,91,255,.5);outline-offset:2px}
    .fade-up{animation:fadeUp .45s both}.delay-1{animation-delay:.08s}.delay-2{animation-delay:.16s}.delay-3{animation-delay:.24s}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @media(max-width:900px){.hero-copy{width:75%}.orbit-wrap{opacity:.55;right:-25px}.setup-layout,.interview-layout{grid-template-columns:1fr}.setup-side,.side-card{position:static}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:680px){.topbar{height:66px;padding:0 14px}.brand span:last-child{display:none}.mobile-menu{display:block}.nav{position:absolute;top:66px;left:0;right:0;background:white;border-bottom:1px solid var(--line);padding:8px 12px;display:none}.nav.open{display:flex;flex-wrap:wrap}.nav-button{font-size:13px}.user-chip{margin-left:auto}.user-chip .user-name{display:none}main{padding:20px 14px 48px}.hero{padding:34px 24px;min-height:auto;border-radius:20px}.hero-copy{width:100%}.hero h1{font-size:38px}.hero-actions{flex-wrap:wrap}.hero-art{display:none}.stats,.grid,.form-grid,.result-grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:flex-start}.page-head h1{font-size:28px}.question-card{min-height:auto}.question-text{font-size:20px}.session-row{align-items:flex-start}.session-actions{flex-direction:column}.toolbar{flex-direction:column}.toolbar input,.toolbar select{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a href="#" class="brand" data-view="home"><span class="brand-mark" id="brandIcon"></span><span>Interview Coach</span></a>
    <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Toggle navigation"></button>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Practice and learning only · Feedback may be AI-generated or rule-based · Not a hiring decision</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const API="/api/v1";
const app=document.querySelector("#app"),nav=document.querySelector("#nav");
const state={user:null,view:"home",interview:null,questionIndex:0,questions:[],answers:{},result:null};
const icons={spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7L12 3zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15zM5 13l.8 1.7L7.5 15.5l-1.7.8L5 18l-.8-1.7-1.7-.8 1.7-.8L5 13z"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19.5v-9z"/><path d="M9 21v-7h6v7"/></svg>',bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM8 5v14M12 9h5M12 12h5M12 15h3"/></svg>',history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 109-9 9.5 9.5 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0115 0"/></svg>',logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 5l5 5M4 20l4.5-1 10-10a2.8 2.8 0 000-4l-.5-.5a2.8 2.8 0 00-4 0l-10 10L3 20z"/></svg>',trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8M16 7h5v5"/></svg>',arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M14 7l5 5-5 5"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M10 7l-5 5 5 5"/></svg>',play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg>'};
document.querySelector("#brandIcon").innerHTML=icons.spark;document.querySelector("#mobileMenu").innerHTML=icons.menu;
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function notify(message){const t=document.querySelector("#toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200)}
async function api(path,options={}){const token=localStorage.getItem("interviewCoachToken");const response=await fetch(`${API}${path}`,{...options,headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{}),...options.headers}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.detail||"The request could not be completed.");return body}
function shellTitle(eyebrow,title,copy="",action=""){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${copy?`<p class="muted">${copy}</p>`:""}</div>${action}</div>`}
async function renderNav(){nav.innerHTML=state.user?`<button class="nav-button ${state.view==="home"?"active":""}" data-view="home">Home</button><button class="nav-button ${state.view==="bank"?"active":""}" data-view="bank">Question bank</button><button class="nav-button ${state.view==="history"?"active":""}" data-view="history">History</button><div class="user-chip"><span class="avatar">${escapeHtml(state.user.display_name?.[0]?.toUpperCase()||"U")}</span><button class="nav-button user-name" data-view="profile">${escapeHtml(state.user.display_name)}</button><button class="icon-button" id="logout" aria-label="Sign out">${icons.logout}</button></div>`:`<button class="nav-button" data-view="auth">Sign in / Register</button>`;document.querySelectorAll("[data-view]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();go(el.dataset.view)}));document.querySelector("#logout")?.addEventListener("click",logout);nav.classList.remove("open")}
async function loadUser(){const token=localStorage.getItem("interviewCoachToken");if(!token){state.user=null;await renderNav();return}try{state.user=await api("/profile")}catch{localStorage.removeItem("interviewCoachToken");state.user=null}await renderNav()}
async function go(view){state.view=view;if(view==="home")await renderHome();else if(view==="auth")renderAuth();else if(view==="setup")renderSetup();else if(view==="interview")renderInterview();else if(view==="result")renderResult();else if(view==="history")await renderHistory();else if(view==="bank")await renderBank();else if(view==="profile")await renderProfile();await renderNav();app.focus({preventScroll:true});window.scrollTo({top:0,behavior:"smooth"})}
async function renderHome(){if(!state.user){app.innerHTML=`<div class="page"><section class="hero"><div class="hero-copy"><div class="eyebrow">Your personal practice space</div><h1>Speak clearly.<br>Think confidently.</h1><p>Build interview-ready stories, sharpen technical explanations, and get useful feedback from every practice session.</p><div class="hero-actions"><button class="button primary-light" data-go="auth">Start practising ${icons.arrow}</button><button class="button ghost" data-go="bank">Explore questions</button></div></div><div class="hero-art"><div class="orbit-wrap"><div class="orbit"></div><div class="orbit two"></div><div class="center-orb">✦</div></div></div></section><div class="section-title"><div><h2>Designed for better practice</h2><p>A focused experience without distractions.</p></div></div><section class="grid"><article class="card feature fade-up"><span class="feature-icon">${icons.spark}</span><h3>Original questions</h3><p>Practise curated behavioral and technical prompts with clear difficulty levels.</p></article><article class="card feature fade-up delay-1"><span class="feature-icon">${icons.trend}</span><h3>Actionable feedback</h3><p>Review strengths, improvements, and transparent rule-based or AI feedback.</p></article><article class="card feature fade-up delay-2"><span class="feature-icon">${icons.history}</span><h3>Saved progress</h3><p>Return to complete sessions and review your interview history anytime.</p></article></section><div class="notice blue"><strong>Transparent by design:</strong> AI mode is server-configured and optional. Otherwise, feedback comes from a simple rule-based demo—not factual or hiring evaluation.</div></div>`;bindDataViews();return}app.innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">Practice dashboard</div><h1>Welcome back, ${escapeHtml(state.user.display_name)}</h1><p class="muted">Choose a focus and build momentum, one answer at a time.</p></div><button class="button" data-go="setup">New interview ${icons.arrow}</button></div><div class="stats" id="stats"><article class="stat fade-up"><div><div class="stat-label">Completed sessions</div><div class="stat-value">—</div></div><span class="stat-icon">${icons.check}</span></article><article class="stat fade-up delay-1"><div><div class="stat-label">Questions answered</div><div class="stat-value">—</div></div><span class="stat-icon">${icons.edit}</span></article><article class="stat fade-up delay-2"><div><div class="stat-label">Average score</div><div class="stat-value">—</div></div><span class="stat-icon">${icons.trend}</span></article></div><div class="section-title"><div><h2>Choose your practice mode</h2><p>Start with a format that matches your goal.</p></div></div><section class="grid"><article class="card feature fade-up"><span class="pill">Behavioral</span><h3>Tell your story</h3><p>Communication, teamwork, ownership, and reflection.</p><button class="link-button" data-quick="behavioral">Practise behavioral ${icons.arrow}</button></article><article class="card feature fade-up delay-1"><span class="pill">Technical</span><h3>Explain your thinking</h3><p>Databases, systems, APIs, and computer science basics.</p><button class="link-button" data-quick="technical">Practise technical ${icons.arrow}</button></article><article class="card feature fade-up delay-2"><span class="pill">Question bank</span><h3>Explore first</h3><p>Search and filter original sample questions.</p><button class="link-button" data-go="bank">Browse questions ${icons.arrow}</button></article></section><div class="section-title"><div><h2>Recent sessions</h2><p>Your latest saved practice.</p></div><button class="link-button" data-go="history">View history ${icons.arrow}</button></div><div class="activity" id="recent"><div class="empty">Loading sessions…</div></div></div>`;bindDataViews();try{const {sessions}=await api("/interviews");const done=sessions.filter(s=>s.status==="completed");const scores=done.map(s=>s.overall_score).filter(v=>typeof v==="number");const values=document.querySelectorAll(".stat-value");values[0].textContent=done.length;values[1].textContent=done.reduce((n,s)=>n+s.question_count,0);values[2].textContent=scores.length?`${Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)}%`:"—";document.querySelector("#recent").innerHTML=sessions.slice(0,4).map(s=>`<div class="session-row"><div><strong>${escapeHtml(s.category)} · ${escapeHtml(s.difficulty)}</strong><small>${escapeHtml(s.created_at?.replace("T"," · ").slice(0,17)||"")} · ${s.question_count} questions</small></div><div class="session-actions"><span class="pill ${s.status==="completed"?"completed":"progress"}">${s.status==="completed"?"Completed":"In progress"}</span><button class="button small secondary" data-session="${escapeHtml(s.id)}">${s.status==="completed"?"Review":"Continue"}</button></div></div>`).join("")||`<div class="empty">No sessions yet. Create your first interview to begin.</div>`;document.querySelectorAll("[data-session]").forEach(b=>b.addEventListener("click",()=>openSession(b.dataset.session))) }catch(error){document.querySelector("#recent").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}
function bindDataViews(){document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));document.querySelectorAll("[data-quick]").forEach(b=>b.addEventListener("click",()=>{go("setup").then(()=>{const el=document.querySelector(`[name=category][value=${b.dataset.quick}]`);if(el)el.checked=true})}))}
function renderAuth(){const mode=state.authMode||"register";app.innerHTML=`<div class="page"><div class="auth-wrap"><div class="card"><div class="eyebrow">Your interview workspace</div><h1>${mode==="login"?"Welcome back":"Create your account"}</h1><form class="auth-form" id="auth-form"><div class="field ${mode==="login"?"hidden":""}"><label for="display_name">Display name</label><input id="display_name" name="display_name" maxlength="80" value="Learner"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="10" maxlength="128" required placeholder="At least 10 characters"></div><p class="error" id="auth-error"></p><button class="button" id="auth-submit">${mode==="login"?"Sign in":"Create account"}</button></form><button class="link-button" id="auth-switch">${mode==="login"?"New here? Create an account":"Already have an account? Sign in"}</button></div></div></div>`;document.querySelector("#auth-switch").addEventListener("click",()=>{state.authMode=mode==="login"?"register":"login";renderAuth()});document.querySelector("#auth-form").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget),submit=document.querySelector("#auth-submit");submit.disabled=true;document.querySelector("#auth-error").textContent="";try{const data=await api(`/auth/${mode==="login"?"login":"register"}`,{method:"POST",body:JSON.stringify({email:form.get("email"),password:form.get("password"),display_name:form.get("display_name")})});localStorage.setItem("interviewCoachToken",data.access_token);state.user=data.user;notify(mode==="login"?"Signed in.":"Account created. Welcome!");await go("home") }catch(error){document.querySelector("#auth-error").textContent=error.message}finally{submit.disabled=false}})}
async function logout(){try{await api("/auth/logout",{method:"POST"})}catch{}localStorage.removeItem("interviewCoachToken");state.user=null;notify("You have signed out.");await go("home")}
function renderSetup(){app.innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">New practice interview</div><h1>Set your focus</h1><p class="muted">Choose a format and interview length.</p></div></div><div class="setup-layout"><form class="card" id="setup-form"><div class="form-grid"><div class="field full"><label>Interview category</label><div class="choice-grid"><div class="choice"><input type="radio" name="category" id="cat-behavioral" value="behavioral"><label for="cat-behavioral"><strong>Behavioral</strong><span>Stories and reflection</span></label></div><div class="choice"><input type="radio" name="category" id="cat-technical" value="technical"><label for="cat-technical"><strong>Technical</strong><span>Concepts and reasoning</span></label></div><div class="choice"><input type="radio" name="category" id="cat-mixed" value="mixed" checked><label for="cat-mixed"><strong>Mixed</strong><span>A balanced practice set</span></label></div></div></div><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty" name="difficulty"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></div><div class="field"><label for="question_count">Number of questions</label><select id="question_count" name="question_count"><option value="1">1 question</option><option value="3">3 questions</option><option value="5" selected>5 questions</option><option value="10">10 questions</option></select></div><div class="field full"><label for="target_role">Target role <span class="muted">(optional)</span></label><input id="target_role" name="target_role" maxlength="100" placeholder="e.g. Software Engineer"></div></div><div class="form-actions"><button type="button" class="button secondary" data-go="home">Cancel</button><button class="button" id="create-interview">Create interview ${icons.arrow}</button></div></form><aside class="card setup-side"><span class="feature-icon">${icons.spark}</span><h3>Practice tip</h3><p class="muted">For behavioral prompts, use a clear context, your actions, and the result. Keep technical answers structured and mention trade-offs.</p><div class="notice">You can save answers and return later.</div></aside></div></div>`;bindDataViews();document.querySelector("#setup-form").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget),button=document.querySelector("#create-interview");button.disabled=true;try{const data=await api("/interviews",{method:"POST",body:JSON.stringify({category:form.get("category"),difficulty:form.get("difficulty"),question_count:Number(form.get("question_count")),target_role:form.get("target_role")||null})});state.interview=data;state.questions=data.questions||[];state.questionIndex=0;state.answers={};await go("interview")}catch(error){notify(error.message)}finally{button.disabled=false}})}
async function openSession(id){try{const data=await api(`/interviews/${id}`);state.interview=data;state.questions=data.questions||[];state.questionIndex=0;state.answers={};for(const answer of data.answers||[])state.answers[answer.question_id]=answer.answer_text;if(data.status==="completed") {try{const summary=await api(`/interviews/${id}/complete`);state.result=summary;await go("result")}catch(error){notify(error.message)}}else await go("interview")}catch(error){notify(error.message)}}
async function renderInterview(){if(!state.interview||!state.questions.length){await go("home");return}const total=state.questions.length,q=state.questions[state.questionIndex];app.innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">Practice interview · ${escapeHtml(state.interview.category)}</div><h1>Question ${state.questionIndex+1} of ${total}</h1></div><button class="back-button" data-go="home">${icons.back} Dashboard</button></div><div class="interview-layout"><section class="card question-card"><div class="progress-meta"><span>${escapeHtml(q.category)} · ${escapeHtml(q.difficulty)}</span><span>${Math.round(((state.questionIndex+1)/total)*100)}% complete</span></div><div class="progress"><span style="width:${Math.round(((state.questionIndex+1)/total)*100)}%"></span></div><div class="pill">${escapeHtml((q.skills||[]).join(" · "))}</div><h2 class="question-text">${escapeHtml(q.question_text)}</h2><label class="field"><span class="sr-only">Your answer</span><textarea id="answer" maxlength="5000" placeholder="Take a moment. Describe the context, your actions, and the outcome…">${escapeHtml(state.answers[q.id]||"")}</textarea></label><div class="counter"><span id="counter">${(state.answers[q.id]||"").length}</span>/5000 characters</div><div class="answer-footer"><button class="button secondary" id="previous" ${state.questionIndex===0?"disabled":""}>${icons.back} Previous</button><button class="button" id="save-next">${state.questionIndex===total-1?`Complete interview ${icons.check}`:`Save & next ${icons.arrow}`}</button></div></section><aside class="card side-card"><div class="feature-icon">${icons.edit}</div><h3>Answer structure</h3><ul class="rubric-list"><li>Context: What was happening?</li><li>Action: What did you personally do?</li><li>Result: What changed or improved?</li><li>Reflection: What did you learn?</li></ul></aside></div></div>`;bindDataViews();const answer=document.querySelector("#answer");answer.addEventListener("input",()=>document.querySelector("#counter").textContent=answer.value.length);document.querySelector("#previous").addEventListener("click",()=>{if(state.questionIndex>0){state.questionIndex--;renderInterview()}});document.querySelector("#save-next").addEventListener("click",async()=>{if(!answer.value.trim()){notify("Write an answer before continuing.");answer.focus();return}const button=document.querySelector("#save-next");button.disabled=true;try{await api(`/interviews/${state.interview.id}/answers/${q.id}`,{method:"PUT",body:JSON.stringify({answer_text:answer.value})});state.answers[q.id]=answer.value;if(state.questionIndex<total-1){state.questionIndex++;renderInterview()}else{const result=await api(`/interviews/${state.interview.id}/complete`,{method:"POST"});state.result=result;await go("result")}}catch(error){notify(error.message)}finally{button.disabled=false}})}
function renderResult(){const result=state.result;if(!result){go("home");return}const percent=Number(result.overall_score||0);app.innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">Interview complete</div><h1>Your practice review</h1><p class="muted">${escapeHtml(result.feedback_type==="anthropic"?"AI practice feedback":"Rule-based practice feedback")}</p></div><button class="button" data-go="setup">Practise again ${icons.arrow}</button></div><div class="setup-layout"><div><div class="card"><div class="score-ring" style="--score:${percent}%"><span>${percent}</span></div><div style="text-align:center"><strong>Overall practice score</strong><p class="muted">Educational feedback only—not a hiring evaluation.</p></div></div><div class="result-grid"><section class="card"><h3>Strengths</h3><ul>${(result.strengths||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")||"<li>Practice session completed.</li>"}</ul></section><section class="card"><h3>Areas to improve</h3><ul>${(result.improvements||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")||"<li>Keep practising with clear examples.</li>"}</ul></section></div></div><aside class="card side-card"><h3>Suggested practice</h3><ul class="rubric-list">${(result.suggested_practice||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")||"<li>Practise one new example.</li>"}</ul><div class="notice">${escapeHtml((result.limitations||["Feedback is an educational aid."]).join(" "))}</div></aside></div><div class="section-title"><div><h2>Question feedback</h2></div></div><div class="card">${(result.questions||[]).map((q,i)=>`<div class="question-item"><div style="display:flex;justify-content:space-between"><strong>${i+1}. ${escapeHtml(q.question_text)}</strong><span class="pill">${q.score}%</span></div><p>${escapeHtml(q.feedback)}</p></div>`).join("")}</div></div>`;bindDataViews()}
async function renderHistory(){app.innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">Saved practice</div><h1>Interview history</h1><p class="muted">Review progress and revisit sessions.</p></div><button class="button" data-go="setup">New interview ${icons.arrow}</button></div><div class="toolbar"><select id="history-status"><option value="">All statuses</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select><select id="history-category"><option value="">All categories</option><option value="behavioral">Behavioral</option><option value="technical">Technical</option><option value="mixed">Mixed</option></select></div><div id="history-list" class="activity"><div class="empty">Loading history…</div></div></div>`;bindDataViews();async function load(){const status=document.querySelector("#history-status").value,category=document.querySelector("#history-category").value;try{const params=new URLSearchParams({limit:"100"});if(status)params.set("status",status);if(category)params.set("category",category);const {sessions}=await api(`/interviews?${params}`);document.querySelector("#history-list").innerHTML=sessions.map(s=>`<div class="session-row"><div><strong>${escapeHtml(s.category)} · ${escapeHtml(s.difficulty)}</strong><small>${escapeHtml(s.created_at?.replace("T"," · ").slice(0,17)||"")} · Score: ${s.overall_score??"—"}</small></div><div class="session-actions"><span class="pill ${s.status==="completed"?"completed":"progress"}">${s.status==="completed"?"Completed":"In progress"}</span><button class="button small secondary" data-session="${escapeHtml(s.id)}">${s.status==="completed"?"Review":"Continue"}</button><button class="button small danger" data-delete="${escapeHtml(s.id)}">Delete</button></div></div>`).join("")||`<div class="empty">No interviews match these filters.</div>`;document.querySelectorAll("[data-session]").forEach(b=>b.addEventListener("click",()=>openSession(b.dataset.session)));document.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm("Delete this interview and its answers?"))return;try{await api(`/interviews/${b.dataset.delete}`,{method:"DELETE"});notify("Interview deleted.");load()}catch(error){notify(error.message)}}))}catch(error){document.querySelector("#history-list").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}document.querySelector("#history-status").addEventListener("change",load);document.querySelector("#history-category").addEventListener("change",load);load()}
async function renderBank(){app.innerHTML=`<div class="page">${shellTitle("Practice library","Question bank","Search original questions by category, difficulty, or skill.")}<div class="toolbar"><input id="bank-search" maxlength="120" placeholder="Search questions…"><select id="bank-category"><option value="">All categories</option><option value="behavioral">Behavioral</option><option value="technical">Technical</option></select><select id="bank-difficulty"><option value="">All levels</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div><div id="bank-list" class="activity"><div class="empty">Loading questions…</div></div></div>`;async function load(){const params=new URLSearchParams({limit:"100"});const q=document.querySelector("#bank-search").value.trim(),category=document.querySelector("#bank-category").value,difficulty=document.querySelector("#bank-difficulty").value;if(q)params.set("q",q);if(category)params.set("category",category);if(difficulty)params.set("difficulty",difficulty);try{const data=await api(`/questions?${params}`);document.querySelector("#bank-list").innerHTML=data.questions.map(question=>`<article class="session-row"><div><strong>${escapeHtml(question.question_text)}</strong><small>${escapeHtml(question.category)} · ${escapeHtml(question.difficulty)} · ${escapeHtml(question.skills.join(" · "))}</small></div><span class="pill">${escapeHtml(question.id)}</span></article>`).join("")||`<div class="empty">No questions match your search.</div>`}catch(error){document.querySelector("#bank-list").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}for(const id of ["bank-search","bank-category","bank-difficulty"]){document.querySelector(`#${id}`).addEventListener(id==="bank-search"?"input":"change",load)}load()}
async function renderProfile(){const user=await api("/profile");app.innerHTML=`<div class="page"><div class="auth-wrap"><div class="card"><div class="eyebrow">Account settings</div><h1>Your profile</h1><form class="auth-form" id="profile-form"><div class="field"><label>Display name</label><input name="display_name" maxlength="80" value="${escapeHtml(user.display_name)}"></div><div class="field"><label>Education level</label><input name="education_level" maxlength="80" value="${escapeHtml(user.education_level||"")}"></div><div class="field"><label>Field of study</label><input name="field_of_study" maxlength="100" value="${escapeHtml(user.field_of_study||"")}"></div><div class="field"><label>Experience level</label><select name="experience_level"><option value="student" ${(user.experience_level||"")==="student"?"selected":""}>Student</option><option value="entry_level" ${(user.experience_level||"")==="entry_level"?"selected":""}>Entry level</option><option value="early_career" ${(user.experience_level||"")==="early_career"?"selected":""}>Early career</option></select></div><div class="field"><label>Target role</label><input name="target_role" maxlength="100" value="${escapeHtml(user.target_role||"")}"></div><button class="button">Save profile</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="button danger" id="delete-account">Delete account and data</button></div></div></div>`;document.querySelector("#profile-form").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget),payload={display_name:form.get("display_name"),education_level:form.get("education_level")||null,field_of_study:form.get("field_of_study")||null,experience_level:form.get("experience_level")||null,target_role:form.get("target_role")||null};try{const updated=await api("/profile",{method:"PATCH",body:JSON.stringify(payload)});state.user=updated;await renderNav();notify("Profile updated.")}catch(error){notify(error.message)}});document.querySelector("#delete-account").addEventListener("click",async()=>{if(!confirm("Permanently delete your account, interviews, and answers?"))return;try{await api("/profile",{method:"DELETE"});localStorage.removeItem("interviewCoachToken");state.user=null;notify("Account deleted.");await go("home") }catch(error){notify(error.message)}})}
document.querySelector("#mobileMenu").addEventListener("click",()=>nav.classList.toggle("open"));loadUser().then(()=>go("home"));
</script>
