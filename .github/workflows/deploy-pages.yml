name: Deploy IntelliHire to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          INTELLIHIRE_API_BASE: ${{ vars.INTELLIHIRE_API_BASE }}
        run: |
          mkdir -p docs
          cp Fontend.html docs/index.html
          printf 'window.INTELLIHIRE_API_BASE = %s;\n' \
            "$(python3 -c 'import os, json; print(json.dumps(os.environ.get("INTELLIHIRE_API_BASE", "").strip()))')" \
            > docs/config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
